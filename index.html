<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Renderer - WebView</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'midnight' : 'aurora');
      }
    })();
  </script>

  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
  <script src="libs/marked.min.js"></script>
  <script src="libs/mermaid.min.js"></script>

  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/rtl.css">

  <style>
    .app { padding-bottom: 2rem; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: 13px;
      color: var(--muted-text);
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }
    .status-dot.waiting { background: #f59e0b; animation: pulse 1.5s infinite; }
    .status-dot.ok { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .status-text { flex: 1; }
    .pdf-download-btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary);
      transition: all 200ms ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .pdf-download-btn:hover {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow);
    }
    .pdf-download-btn:active { transform: translateY(0); }
    .pdf-download-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 0;
    }
    .toolbar .direction-controls { margin-left: auto; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 60px 20px;
      color: var(--muted-text);
      text-align: center;
    }
    .empty-state i { font-size: 2.8rem; opacity: 0.35; }
    .empty-state p { font-size: 15px; font-style: italic; max-width: 340px; line-height: 1.5; }
    .empty-state code {
      background: var(--code-bg, rgba(0,0,0,.08));
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 12px;
    }
    @media (max-width: 768px) {
      .pdf-download-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📝 Markdown Renderer</h1>
      <p class="subtitle">WebView — content pushed via local API</p>
    </div>

    <div class="theme-switcher">
      <button id="themeButton" class="theme-button" aria-label="Switch theme" aria-expanded="false">
        <span class="theme-dot"></span>
        <span id="themeButtonLabel">Theme: Aurora</span>
      </button>
      <div id="themeDropdown" class="theme-dropdown">
        <button class="theme-option active" data-theme="aurora"><span class="theme-icon aurora"></span> Aurora</button>
        <button class="theme-option" data-theme="midnight"><span class="theme-icon midnight"></span> Midnight</button>
        <button class="theme-option" data-theme="ocean"><span class="theme-icon ocean"></span> Ocean</button>
        <button class="theme-option" data-theme="forest"><span class="theme-icon forest"></span> Forest</button>
        <button class="theme-option" data-theme="sunset"><span class="theme-icon sunset"></span> Sunset</button>
      </div>
    </div>

    <div class="status-bar">
      <span class="status-dot waiting" id="statusDot"></span>
      <span class="status-text" id="statusText">Waiting for content from API…</span>
      <span id="statusTime"></span>
    </div>

    <div class="panel">
      <div class="toolbar">
        <label class="label" style="margin:0">
          <i class="fas fa-book-open"></i> Preview
        </label>

        <button class="pdf-download-btn" onclick="downloadAsPDF()" title="Download as PDF">
          <i class="fas fa-file-pdf"></i> PDF
        </button>

        <div class="direction-controls">
          <button class="direction-toggle ltr-btn active" onclick="setDirection('ltr')" title="Left to Right">
            <i class="fas fa-arrow-right"></i> LTR
          </button>
          <button class="direction-toggle rtl-btn" onclick="setDirection('rtl')" title="Right to Left">
            <i class="fas fa-arrow-left"></i> RTL
          </button>
          <button class="direction-toggle auto-btn" onclick="setDirection('auto')" title="Auto Detect">
            <i class="fas fa-wand-magic-sparkles"></i> Auto
          </button>
        </div>

        <span class="language-indicator" id="langIndicator">LTR</span>
      </div>

      <div id="output" class="ltr">
        <div class="empty-state">
          <i class="fas fa-satellite-dish"></i>
          <p>Listening for content…<br>
          POST your markdown to<br>
          <code>/api/render</code></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/rtl-detection.js"></script>
  <script src="js/markdown-renderer.js"></script>
  <script src="js/ui-controls.js"></script>
  <script src="js/pdf-export.js"></script>
  <script src="js/mermaid-controls.js"></script>
  <script src="js/config.js"></script>

  <script>
    (function () {
      const API_URL = '/api/content';
      const POLL_MS = 1500;
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const statusTime = document.getElementById('statusTime');
      let lastTimestamp = null;

      function setStatus(state, message, time) {
        dot.className = 'status-dot ' + state;
        statusText.textContent = message;
        statusTime.textContent = time || '';
      }

      function formatTime(ts) {
        if (!ts) return '';
        return new Date(ts).toLocaleTimeString();
      }

      function ensureHiddenInput() {
        let el = document.getElementById('inputArea');
        if (!el) {
          el = document.createElement('textarea');
          el.id = 'inputArea';
          el.style.display = 'none';
          document.body.appendChild(el);
        }
        return el;
      }

      async function poll() {
        try {
          const res = await fetch(API_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);

          const data = await res.json();

          if (!data.markdown) {
            setStatus('waiting', 'API connected — no content yet.', '');
            return;
          }

          if (data.timestamp !== lastTimestamp) {
            lastTimestamp = data.timestamp;
            ensureHiddenInput().value = data.markdown;
            renderOutput();
            setStatus('ok', 'Content rendered successfully.', 'Last update: ' + formatTime(data.timestamp));
          } else {
            setStatus('ok', 'Showing latest content.', 'Last update: ' + formatTime(data.timestamp));
          }
        } catch {
          setStatus('error', 'Cannot reach API server. Is server.js running?', '');
        }
      }

      setStatus('waiting', 'Connecting to local API…', '');
      poll();
      setInterval(poll, POLL_MS);
    })();

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.initThemeSwitcher === 'function') {
        window.initThemeSwitcher();
      }
      setDirection('ltr');
    });
  </script>
</body>
</html>
