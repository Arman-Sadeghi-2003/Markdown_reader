<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Reader</title>

  <!-- All assets served from the virtual host — no internet required -->
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
  <script src="libs/marked.min.js"></script>
  <script src="libs/mermaid.min.js"></script>

  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/rtl.css">

  <style>
    /* Viewer-specific tweaks */
    body { padding: 0; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
    }

    /* Toolbar strip */
    .toolbar-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .toolbar-strip .direction-controls { margin-left: auto; }

    /* Scrollable output */
    .output-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    #output {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Drop / empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--muted-text);
      text-align: center;
      user-select: none;
    }

    .empty-state i  { font-size: 3rem; opacity: 0.25; color: var(--primary); }
    .empty-state h2 { margin: 0; font-size: 1.2rem; color: var(--text-tertiary); font-weight: 500; }
    .empty-state p  { margin: 0; font-size: 14px; opacity: 0.7; }

    /* PDF button */
    .pdf-download-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      transition: all 180ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pdf-download-btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #FFFAF5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow-md);
    }

    .table-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
    }

    .table-wrap table {
        width: max-content;
        min-width: 100%;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Toolbar -->
  <div class="toolbar-strip">
    <label class="label" style="margin:0; font-size:13px;">
      <i class="fas fa-book-open"></i> Preview
    </label>

    <button class="pdf-download-btn" id="pdfBtn" onclick="downloadAsPDF()" disabled>
      <i class="fas fa-file-pdf"></i> PDF
    </button>

    <div class="direction-controls">
      <button class="direction-toggle ltr-btn active" onclick="setDirection('ltr')">
        <i class="fas fa-arrow-right"></i> LTR
      </button>
      <button class="direction-toggle rtl-btn" onclick="setDirection('rtl')">
        <i class="fas fa-arrow-left"></i> RTL
      </button>
      <button class="direction-toggle auto-btn" onclick="setDirection('auto')">
        <i class="fas fa-wand-magic-sparkles"></i> Auto
      </button>
    </div>

    <span class="language-indicator" id="langIndicator">LTR</span>
  </div>

  <!-- Output -->
  <div class="output-wrap">
    <div id="output" class="ltr">
      <div class="empty-state">
        <i class="fas fa-file-alt"></i>
        <h2>No file open</h2>
        <p>Double-click a .md file in Windows Explorer,<br>
           drag &amp; drop one here, or use the Open File button.</p>
      </div>
    </div>
  </div>

</div>

<!-- Scripts (all local) -->
<script src="js/rtl-detection.js"></script>
<script src="js/markdown-renderer.js"></script>
<script src="js/ui-controls.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/mermaid-controls.js"></script>
<script src="js/config.js"></script>

<script>
  /**
   * Called from C# via ExecuteScriptAsync:
   *   window.__renderMarkdown(markdownString)
   *
   * Injects the content into the hidden #inputArea that
   * markdown-renderer.js already knows about, then calls
   * renderOutput() — exactly the same path the web version uses.
   */
  window.__renderMarkdown = function(markdown) {
    // Ensure the hidden textarea exists
    let input = document.getElementById('inputArea');
    if (!input) {
      input = document.createElement('textarea');
      input.id = 'inputArea';
      input.style.display = 'none';
      document.body.appendChild(input);
    }

    input.value = markdown;
    renderOutput();

    // Enable PDF button now that we have content
    const pdfBtn = document.getElementById('pdfBtn');
    if (pdfBtn) pdfBtn.disabled = false;
  };

  // Init direction on load
  document.addEventListener('DOMContentLoaded', () => {
    setDirection('ltr');
  });
</script>
</body>
</html>
